<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <rect width="80" height="80" fill="#F8F9FA" />

  <!-- Architectural Drafting Dot-Grid in Cobalt & Slate -->
  <g fill="#2563EB" fill-opacity="0.14">
    <circle cx="20" cy="20" r="1" />
    <circle cx="60" cy="20" r="1" />
    <circle cx="20" cy="60" r="1" />
    <circle cx="60" cy="60" r="1" />
  </g>

  <!-- Clean Minimalist Grid Lines -->
  <line x1="0" y1="40" x2="80" y2="40" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="1 7" />
  <line x1="40" y1="0" x2="40" y2="80" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.25" stroke-dasharray="1 7" />
</svg>
