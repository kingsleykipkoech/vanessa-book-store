<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="#FAF7F2" />

  <!-- Subtle Woven Bookcloth & Linen Texture Pattern -->
  <g stroke="#C4B8A5" stroke-width="0.5" stroke-opacity="0.18">
    <!-- Horizontal threads -->
    <line x1="0" y1="20" x2="320" y2="20" stroke-dasharray="3 3" />
    <line x1="0" y1="40" x2="320" y2="40" stroke-dasharray="4 2" />
    <line x1="0" y1="60" x2="320" y2="60" stroke-dasharray="2 4" />
    <line x1="0" y1="80" x2="320" y2="80" stroke-dasharray="3 3" />
    <line x1="0" y1="100" x2="320" y2="100" stroke-dasharray="4 2" />
    <line x1="0" y1="120" x2="320" y2="120" stroke-dasharray="2 4" />
    <line x1="0" y1="140" x2="320" y2="140" stroke-dasharray="3 3" />
    <line x1="0" y1="160" x2="320" y2="160" stroke-dasharray="4 2" />
    <line x1="0" y1="180" x2="320" y2="180" stroke-dasharray="2 4" />
    <line x1="0" y1="200" x2="320" y2="200" stroke-dasharray="3 3" />
    <line x1="0" y1="220" x2="320" y2="220" stroke-dasharray="4 2" />
    <line x1="0" y1="240" x2="320" y2="240" stroke-dasharray="2 4" />
    <line x1="0" y1="260" x2="320" y2="260" stroke-dasharray="3 3" />
    <line x1="0" y1="280" x2="320" y2="280" stroke-dasharray="4 2" />
    <line x1="0" y1="300" x2="320" y2="300" stroke-dasharray="2 4" />

    <!-- Vertical threads -->
    <line x1="20" y1="0" x2="20" y2="320" stroke-dasharray="3 3" />
    <line x1="40" y1="0" x2="40" y2="320" stroke-dasharray="2 4" />
    <line x1="60" y1="0" x2="60" y2="320" stroke-dasharray="4 2" />
    <line x1="80" y1="0" x2="80" y2="320" stroke-dasharray="3 3" />
    <line x1="100" y1="0" x2="100" y2="320" stroke-dasharray="2 4" />
    <line x1="120" y1="0" x2="120" y2="320" stroke-dasharray="4 2" />
    <line x1="140" y1="0" x2="140" y2="320" stroke-dasharray="3 3" />
    <line x1="160" y1="0" x2="160" y2="320" stroke-dasharray="2 4" />
    <line x1="180" y1="0" x2="180" y2="320" stroke-dasharray="4 2" />
    <line x1="200" y1="0" x2="200" y2="320" stroke-dasharray="3 3" />
    <line x1="220" y1="0" x2="220" y2="320" stroke-dasharray="2 4" />
    <line x1="240" y1="0" x2="240" y2="320" stroke-dasharray="4 2" />
    <line x1="260" y1="0" x2="260" y2="320" stroke-dasharray="3 3" />
    <line x1="280" y1="0" x2="280" y2="320" stroke-dasharray="2 4" />
    <line x1="300" y1="0" x2="300" y2="320" stroke-dasharray="4 2" />
  </g>

  <!-- Faint Terracotta & Earth Fiber Flecks -->
  <g fill="#C85A32" fill-opacity="0.08">
    <circle cx="48" cy="88" r="1" />
    <circle cx="174" cy="42" r="1.2" />
    <circle cx="264" cy="180" r="1" />
    <circle cx="112" cy="270" r="1.2" />
  </g>
</svg>
